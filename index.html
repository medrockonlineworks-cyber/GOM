<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GOM</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C2B2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GOM" />
    <link rel="apple-touch-icon" href="/gom-logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/gom-logo.svg" />
    
    <!-- Inline fallback CSS to prevent Flash of Unstyled Content (FOUC) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!-- Service Worker & Cache Handling -->
    <script>
      if ('serviceWorker' in navigator) {
        // Automatically unregister stale service workers in dev/iframe preview to prevent blank screen caching issues
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(err => console.warn('SW unregister error:', err));
      }
    </script>
  </head>
  <body class="bg-alabaster text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOM</title>
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GOM" />
    <link rel="apple-touch-icon" href="/gom-logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/gom-logo.svg" />
    
    <!-- Service Worker & Cache Handling -->
    <script>
      if ('serviceWorker' in navigator) {
        // Automatically unregister stale service workers in dev/iframe preview to prevent blank screen caching issues
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(err => console.warn('SW unregister error:', err));
      }
    </script>
  </head>
  <body class="bg-[#0D1B2A] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

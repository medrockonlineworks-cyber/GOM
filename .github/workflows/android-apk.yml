name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional semantic version name (e.g. 1.0.12). Defaults to 1.0.<run_number>.'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Optional user-facing release notes (one bullet per line, no technical jargon).'
        required: false
        default: ''
        type: string
      build_type:
        description: 'Android build variant (release uses configured signing secrets or debug-key fallback).'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build, Verify & Publish GOM Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Capacitor 8 (@capacitor/android 8.x & AGP 8.13.0) compiles with Java 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure preinstalled Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi

      - name: Resolve version, build type, and release target
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
        run: |
          APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          RAW_VERSION="${INPUT_VERSION_NAME:-1.0.${GITHUB_RUN_NUMBER}}"
          APP_VERSION_NAME="${RAW_VERSION#v}"
          APP_VERSION_NAME="${APP_VERSION_NAME#V}"
          BUILD_TYPE="${INPUT_BUILD_TYPE:-release}"
          UPDATE_REPO="${PUBLIC_RELEASE_REPO:-$GITHUB_REPOSITORY}"

          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=$UPDATE_REPO" >> "$GITHUB_ENV"

          echo "Resolved version: v$APP_VERSION_NAME (code $APP_VERSION_CODE), build_type=$BUILD_TYPE"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies using package-lock.json
        run: npm ci

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
          VITE_GITHUB_REPO: ${{ env.UPDATE_REPO }}
        run: npm run build

      - name: Remove Node server bundle before syncing Android web assets
        run: rm -f dist/server.cjs dist/server.cjs.map

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare signing keystore if configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_FILE="/tmp/gom-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "Release signing keystore prepared."
          else
            echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "No release keystore secret configured; falling back to existing debug signing key."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          GITHUB_UPDATE_REPO: ${{ env.UPDATE_REPO }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon \
              -PAPP_VERSION_CODE="$APP_VERSION_CODE" \
              -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
              -PGITHUB_UPDATE_REPO="$GITHUB_UPDATE_REPO"
          else
            ./gradlew assembleRelease --no-daemon \
              -PAPP_VERSION_CODE="$APP_VERSION_CODE" \
              -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
              -PGITHUB_UPDATE_REPO="$GITHUB_UPDATE_REPO"
          fi

      - name: Stage and verify APK package ID and signing certificate
        run: |
          set -euo pipefail
          mkdir -p release-assets

          if [ "$BUILD_TYPE" = "debug" ]; then
            SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi

          if [ ! -f "$SOURCE_APK" ]; then
            echo "Expected APK not found at $SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" "release-assets/GOM.apk"
          ls -lh release-assets/GOM.apk

          BUILD_TOOLS_DIR="$(ls -1d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Android build-tools not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          # Write aapt2 output to a temp file before grepping to avoid SIGPIPE under pipefail
          "$BUILD_TOOLS_DIR/aapt2" dump badging "release-assets/GOM.apk" > /tmp/apk-badging.txt
          if ! grep -F "package: name='com.gom.globalonlinemarket'" /tmp/apk-badging.txt > /dev/null; then
            echo "Package ID verification failed!"
            head -n 5 /tmp/apk-badging.txt
            exit 1
          fi
          if ! grep -F "versionCode='${APP_VERSION_CODE}'" /tmp/apk-badging.txt > /dev/null; then
            echo "versionCode verification failed!"
            head -n 5 /tmp/apk-badging.txt
            exit 1
          fi

          echo "Verified package ID and versionCode successfully."
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "release-assets/GOM.apk"

      - name: Generate checksums, update manifest, and clean release notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node .github/scripts/prepare-release-assets.mjs \
            --dir release-assets \
            --version-name "$APP_VERSION_NAME" \
            --version-code "$APP_VERSION_CODE" \
            --notes "$INPUT_RELEASE_NOTES"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GOM-android-${{ env.BUILD_TYPE }}-v${{ env.APP_VERSION_NAME }}
          path: |
            release-assets/GOM.apk
            release-assets/GOM.apk.sha256
            release-assets/SHA256SUMS.txt
            release-assets/update-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_REPO="$GITHUB_REPOSITORY"
          RELEASE_TOKEN="$GITHUB_TOKEN"

          if [ -n "$PUBLIC_RELEASE_REPO" ]; then
            if [ -z "$PUBLIC_RELEASE_TOKEN" ]; then
              echo "PUBLIC_RELEASE_REPO is set, but PUBLIC_RELEASE_TOKEN secret is missing."
              exit 1
            fi
            TARGET_REPO="$PUBLIC_RELEASE_REPO"
            RELEASE_TOKEN="$PUBLIC_RELEASE_TOKEN"
          fi

          export GH_TOKEN="$RELEASE_TOKEN"

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/GOM.apk \
              release-assets/GOM.apk.sha256 \
              release-assets/SHA256SUMS.txt \
              release-assets/update-manifest.json \
              --repo "$TARGET_REPO" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --title "GOM $RELEASE_TAG" \
              --notes-file release-assets/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              release-assets/GOM.apk \
              release-assets/GOM.apk.sha256 \
              release-assets/SHA256SUMS.txt \
              release-assets/update-manifest.json \
              --repo "$TARGET_REPO" \
              --title "GOM $RELEASE_TAG" \
              --notes-file release-assets/release-notes.md \
              --latest
          fi

      - name: Clean up temporary keystore and verification files
        if: always()
        run: rm -f /tmp/gom-release.keystore /tmp/apk-badging.txt
